<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="StopWatch Pro" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>StopWatch Pro</title>
</head>
<body>
  <main class="app" aria-label="Stoppuhr">
    <section class="display-wrap" aria-live="polite" aria-atomic="true">
      <div id="timeDisplay" class="time-display">00:00</div>
    </section>

    <section class="controls" aria-label="Steuerung">
      <button id="startButton" class="control start" type="button">START</button>
      <button id="pauseButton" class="control pause" type="button" disabled>PAUSE</button>
      <button id="resetButton" class="control reset" type="button">RESET</button>
    </section>

    <div id="portraitNotice" class="portrait-notice" role="status">
      Bitte das iPad ins Querformat drehen.
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
